<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <title>UI Kit - Design Tokens & Components</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../design-tokens.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--snow_white, #ffffff);
            color: var(--black, #212121);
            line-height: 1.6;
            padding: 40px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 60px;
            padding-bottom: 30px;
            border-bottom: 2px solid var(--dark_grey, #f0f0f0);
        }

        .header h1 {
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--black, #212121);
        }

        .header p {
            font-size: 18px;
            color: var(--color-a3a3a3, #a3a3a3);
        }

        .section {
            margin-bottom: 80px;
        }

        .section-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 30px;
            color: var(--black, #212121);
            padding-bottom: 16px;
            border-bottom: 1px solid var(--dark_grey, #f0f0f0);
        }

        /* Colors Grid */
        .colors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .color-card {
            background: var(--White, #fefefe);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid var(--dark_grey, #f0f0f0);
        }

        .color-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .color-swatch {
            width: 100%;
            height: 120px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--dark_grey, #f0f0f0);
        }

        .color-info {
            font-size: 14px;
        }

        .color-name {
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--black, #212121);
        }

        .color-value {
            color: var(--color-a3a3a3, #a3a3a3);
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        /* Typography */
        .typography-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 24px;
        }

        .typography-item {
            background: var(--White, #fefefe);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid var(--dark_grey, #f0f0f0);
        }

        .typography-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .typography-header {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--dark_grey, #f0f0f0);
        }

        .typography-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--black, #212121);
            margin-bottom: 8px;
        }

        .typography-preview {
            margin-bottom: 20px;
            color: var(--black, #212121);
            padding: 24px;
            background: var(--dark_grey, #f0f0f0);
            border-radius: 8px;
            border-left: 4px solid var(--black, #212121);
            min-height: 80px;
            display: flex;
            align-items: center;
        }

        .typography-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            font-size: 13px;
            color: var(--color-a3a3a3, #a3a3a3);
        }

        .typography-detail {
            font-family: 'Courier New', monospace;
            padding: 8px;
            background: var(--dark_grey, #f0f0f0);
            border-radius: 4px;
        }

        .typography-detail strong {
            color: var(--black, #212121);
            display: block;
            margin-bottom: 4px;
            font-family: 'Inter', sans-serif;
        }

        /* Components */
        .components-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .component-card {
            background: var(--White, #fefefe);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 2px solid transparent;
        }

        .component-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            border-color: var(--dark_grey, #f0f0f0);
        }

        .component-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--dark_grey, #f0f0f0);
        }

        .component-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--black, #212121);
            flex: 1;
        }

        .component-visual {
            width: 100%;
            min-height: 120px;
            background: var(--dark_grey, #f0f0f0);
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--color-a3a3a3, #a3a3a3);
            padding: 20px;
        }

        .component-info {
            font-size: 13px;
            color: var(--color-a3a3a3, #a3a3a3);
            line-height: 1.8;
        }

        .component-info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--dark_grey, #f0f0f0);
        }

        .component-info-row:last-child {
            border-bottom: none;
        }

        .component-info-label {
            font-weight: 600;
            color: var(--black, #212121);
            font-family: 'Inter', sans-serif;
        }

        .component-info-value {
            font-family: 'Courier New', monospace;
            color: var(--color-a3a3a3, #a3a3a3);
        }

        /* Effects */
        .effects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .effect-card {
            background: var(--White, #fefefe);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--dark_grey, #f0f0f0);
        }

        .effect-demo {
            width: 100%;
            height: 100px;
            background: var(--White, #fefefe);
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--dark_grey, #f0f0f0);
        }

        /* Back link */
        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: var(--black, #212121);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 0.6;
        }

        /* Component examples */
        .kit-card {
            background: var(--White, #fefefe);
            border-radius: 11px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .kit-card-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--dark_grey, #f0f0f0) 0%, var(--color-a3a3a3, #a3a3a3) 100%);
        }

        .kit-card-info {
            padding: 20px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .kit-card-icon {
            width: 34px;
            height: 34px;
            border-radius: 4px;
            background: var(--dark_grey, #f0f0f0);
            flex-shrink: 0;
        }

        .kit-card-text {
            flex: 1;
        }

        .kit-card-title {
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            font-weight: 400;
            color: var(--color-424242, #424242);
            margin-bottom: 4px;
        }

        .kit-card-tags {
            display: flex;
            gap: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--color-a3a3a3, #a3a3a3);
        }

        .kit-button {
            background: var(--color-f2f2f2, #f2f2f2);
            border: none;
            padding: 4px 15px;
            border-radius: 10px;
            box-shadow: var(--drop-shadow);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .kit-button-text {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: var(--black, #212121);
        }

        .kit-button-badge {
            background: var(--color-171615, #171615);
            color: var(--White, #fefefe);
            padding: 0 3px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 400;
        }

        .kit-chips {
            background: var(--black, #212121);
            color: var(--White, #fefefe);
            padding: 5px 10px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .kit-header {
            background: var(--color-f2f2f2, #f2f2f2);
            padding: 6px;
            border-radius: 10px;
            box-shadow: var(--drop-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .kit-logo {
            display: flex;
            align-items: center;
            gap: 5.735px;
        }

        .kit-logo-icon {
            width: 25.807px;
            height: 25.807px;
            background: var(--color-151515, #151515);
            border-radius: 1.898px;
        }

        .kit-logo-text {
            font-family: 'Roboto Flex', sans-serif;
            font-size: 30.324px;
            font-weight: 400;
            color: var(--color-151515, #151515);
        }

        .kit-header-button {
            background: var(--color-171615, #171615);
            color: var(--color-f6f4f0, #f6f4f0);
            padding: 14px 20px;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Назад к проектам</a>
        
        <div class="header">
            <h1>UI Kit & Design Tokens</h1>
            <p>Все компоненты, цвета, типографика и стили из Figma файла Inspire</p>
            <p style="margin-top: 12px; font-size: 14px; color: var(--color-a3a3a3, #a3a3a3);">
                Названия токенов сохранены как в Figma файле
            </p>
        </div>

        <!-- Colors Section -->
        <section id="colors" class="section">
            <h2 class="section-title">Цвета (Colors)</h2>
            <div class="colors-grid" id="colorsGrid">
                <!-- Colors will be loaded here -->
            </div>
        </section>

        <!-- Typography Section -->
        <section id="typography" class="section">
            <h2 class="section-title">Типографика (Typography)</h2>
            <div class="typography-list" id="typographyList">
                <!-- Typography will be loaded here -->
            </div>
        </section>

        <!-- Components Section -->
        <section id="components" class="section">
            <h2 class="section-title">Компоненты (Components)</h2>
            <div class="components-grid" id="componentsGrid">
                <!-- Components will be loaded here -->
            </div>
        </section>

        <!-- Effects Section -->
        <section id="effects" class="section">
            <h2 class="section-title">Эффекты (Effects)</h2>
            <div class="effects-grid" id="effectsGrid">
                <!-- Effects will be loaded here -->
            </div>
        </section>
    </div>

    <script>
        // Данные из Figma Variables
        const designTokens = {
            colors: {
                "black": { hex: "#212121", name: "black", description: "Основной черный цвет" },
                "White": { hex: "#fefefe", name: "White", description: "Белый цвет" },
                "dark_grey": { hex: "#f0f0f0", name: "dark_grey", description: "Темно-серый цвет" },
                "snow_white": { hex: "#ffffff", name: "snow_white", description: "Снежно-белый цвет" },
                "color-424242": { hex: "#424242", name: "color-424242", description: "Серый цвет для текста" },
                "color-a3a3a3": { hex: "#a3a3a3", name: "color-a3a3a3", description: "Светло-серый цвет" },
                "color-f2f2f2": { hex: "#f2f2f2", name: "color-f2f2f2", description: "Очень светло-серый" },
                "color-171615": { hex: "#171615", name: "color-171615", description: "Темный цвет для кнопок" },
                "color-d6d6d6": { hex: "#d6d6d6", name: "color-d6d6d6", description: "Серый для иконок" },
                "color-151515": { hex: "#151515", name: "color-151515", description: "Очень темный цвет" },
                "color-f6f4f0": { hex: "#f6f4f0", name: "color-f6f4f0", description: "Бежевый фон" }
            },
            typography: [
                {
                    name: "12/semi_bold",
                    family: "Inter",
                    size: 12,
                    weight: 600,
                    lineHeight: "100%",
                    letterSpacing: 0,
                    example: "New Tag Text"
                },
                {
                    name: "14/semi_bold",
                    family: "Inter",
                    size: 14,
                    weight: 600,
                    lineHeight: "139.9999976158142%",
                    letterSpacing: 0,
                    example: "Button Label"
                },
                {
                    name: "14/medium",
                    family: "Inter",
                    size: 14,
                    weight: 500,
                    lineHeight: "139.9999976158142%",
                    letterSpacing: 0,
                    example: "Card Tags"
                },
                {
                    name: "24/regular",
                    family: "Inter",
                    size: 24,
                    weight: 400,
                    lineHeight: "100%",
                    letterSpacing: 0,
                    example: "Card Title"
                }
            ],
            components: [
                {
                    name: "Card",
                    description: "Карточка проекта с изображением и информацией",
                    nodeId: "66:230"
                },
                {
                    name: "Button",
                    description: "Кнопка с текстом и значком",
                    nodeId: "69:27"
                },
                {
                    name: "Header",
                    description: "Шапка сайта с логотипом и кнопкой",
                    nodeId: "69:28"
                },
                {
                    name: "chips",
                    description: "Тег/чипс с текстом",
                    nodeId: "88:397"
                }
            ],
            effects: [
                {
                    name: "drop",
                    type: "DROP_SHADOW",
                    description: "Тень для кнопок и карточек",
                    value: "0px 4px 39.5px 0px rgba(0, 0, 0, 0.25)"
                }
            ]
        };

        // Отрисовка цветов
        function renderColors() {
            const grid = document.getElementById('colorsGrid');
            grid.innerHTML = '';

            Object.entries(designTokens.colors).forEach(([key, color]) => {
                const card = document.createElement('div');
                card.className = 'color-card';
                
                card.innerHTML = `
                    <div class="color-swatch" style="background-color: ${color.hex};"></div>
                    <div class="color-info">
                        <div class="color-name">${color.name}</div>
                        <div class="color-value">${color.hex}</div>
                        <div class="color-value" style="margin-top: 4px;">--${key}</div>
                        ${color.description ? `<div class="color-value" style="margin-top: 4px; font-size: 11px; opacity: 0.7;">${color.description}</div>` : ''}
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        // Отрисовка типографики
        function renderTypography() {
            const list = document.getElementById('typographyList');
            list.innerHTML = '';

            designTokens.typography.forEach(typo => {
                const item = document.createElement('div');
                item.className = 'typography-item';
                
                const cssVarName = typo.name.replace(/\//g, '-').toLowerCase();
                
                item.innerHTML = `
                    <div class="typography-header">
                        <div class="typography-name">${typo.name}</div>
                    </div>
                    <div class="typography-preview" style="
                        font-family: '${typo.family}', sans-serif;
                        font-size: ${typo.size}px;
                        font-weight: ${typo.weight};
                        line-height: ${typo.lineHeight};
                        letter-spacing: ${typo.letterSpacing}px;
                    ">
                        ${typo.example}
                    </div>
                    <div class="typography-details">
                        <div class="typography-detail">
                            <strong>CSS Variable</strong>
                            --font-${cssVarName}-*
                        </div>
                        <div class="typography-detail">
                            <strong>Font Family</strong>
                            ${typo.family}
                        </div>
                        <div class="typography-detail">
                            <strong>Font Size</strong>
                            ${typo.size}px
                        </div>
                        <div class="typography-detail">
                            <strong>Font Weight</strong>
                            ${typo.weight}
                        </div>
                        <div class="typography-detail">
                            <strong>Line Height</strong>
                            ${typo.lineHeight}
                        </div>
                        <div class="typography-detail">
                            <strong>Letter Spacing</strong>
                            ${typo.letterSpacing}px
                        </div>
                    </div>
                `;
                
                list.appendChild(item);
            });
        }

        // Загрузка данных карточек из Supabase
        let cardsData = [];
        async function loadCardsData() {
            if (typeof supabase === 'undefined') {
                console.warn('Supabase не подключен, используются статичные данные');
                return;
            }
            
            try {
                const { data: cards, error } = await supabase
                    .from('cards')
                    .select(`
                        *,
                        card_categories (
                            categories (
                                id,
                                name,
                                slug
                            )
                        )
                    `)
                    .order('created_at', { ascending: false })
                    .limit(1); // Берем первую карточку для примера

                if (error) {
                    console.error('Ошибка загрузки карточек:', error);
                    return;
                }

                if (cards && cards.length > 0) {
                    cardsData = cards;
                }
            } catch (error) {
                console.error('Ошибка подключения к Supabase:', error);
            }
        }

        // Отрисовка компонентов
        async function renderComponents() {
            const grid = document.getElementById('componentsGrid');
            grid.innerHTML = '';

            // Загружаем данные карточек перед отрисовкой
            await loadCardsData();

            designTokens.components.forEach(component => {
                const card = document.createElement('div');
                card.className = 'component-card';
                
                let componentHTML = '';
                
                if (component.name === 'Card') {
                    // Используем реальные данные, если они есть, иначе статичные
                    const cardData = cardsData.length > 0 ? cardsData[0] : null;
                    
                    if (cardData) {
                        // Реальные данные из Supabase
                        const imageUrl = cardData.thumbnail_url || cardData.image_url || '';
                        const title = cardData.title || 'Название проекта';
                        const categories = cardData.card_categories?.map(cc => cc.categories).filter(c => c) || [];
                        const categoriesHtml = categories.length > 0 
                            ? categories.map(cat => `<span>${cat.name}</span>`).join('')
                            : '<span>Без категории</span>';
                        
                        componentHTML = `
                            <div class="kit-card">
                                <div class="kit-card-image" style="${imageUrl ? `background-image: url('${imageUrl}'); background-size: cover; background-position: center;` : ''}"></div>
                                <div class="kit-card-info">
                                    <div class="kit-card-icon"></div>
                                    <div class="kit-card-text">
                                        <div class="kit-card-title">${title}</div>
                                        <div class="kit-card-tags">
                                            ${categoriesHtml}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    } else {
                        // Статичные данные (fallback)
                        componentHTML = `
                            <div class="kit-card">
                                <div class="kit-card-image"></div>
                                <div class="kit-card-info">
                                    <div class="kit-card-icon"></div>
                                    <div class="kit-card-text">
                                        <div class="kit-card-title">OWA Investment</div>
                                        <div class="kit-card-tags">
                                            <span>E-Commerce</span>
                                            <span>Food</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                } else if (component.name === 'Button') {
                    componentHTML = `
                        <button class="kit-button">
                            <span class="kit-button-text">Results</span>
                            <span class="kit-button-badge">540</span>
                        </button>
                    `;
                } else if (component.name === 'Header') {
                    componentHTML = `
                        <div class="kit-header">
                            <div class="kit-logo">
                                <div class="kit-logo-icon"></div>
                                <span class="kit-logo-text">Inspirio</span>
                            </div>
                            <button class="kit-header-button">Buy me a coffe</button>
                        </div>
                    `;
                } else if (component.name === 'chips') {
                    componentHTML = `
                        <div class="kit-chips">New</div>
                    `;
                }
                
                card.innerHTML = `
                    <div class="component-header">
                        <div class="component-name">${component.name}</div>
                    </div>
                    <div class="component-visual">
                        ${componentHTML}
                    </div>
                    <div class="component-info">
                        <div class="component-info-row">
                            <span class="component-info-label">Описание</span>
                            <span class="component-info-value">${component.description}</span>
                        </div>
                        <div class="component-info-row">
                            <span class="component-info-label">Node ID</span>
                            <span class="component-info-value">${component.nodeId}</span>
                        </div>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        // Отрисовка эффектов
        function renderEffects() {
            const grid = document.getElementById('effectsGrid');
            grid.innerHTML = '';

            designTokens.effects.forEach(effect => {
                const card = document.createElement('div');
                card.className = 'effect-card';
                
                card.innerHTML = `
                    <div class="effect-demo" style="box-shadow: ${effect.value};">
                        <div style="background: var(--White, #fefefe); padding: 20px; border-radius: 8px;">
                            Drop Shadow Demo
                        </div>
                    </div>
                    <div class="component-info">
                        <div class="component-info-row">
                            <span class="component-info-label">Название</span>
                            <span class="component-info-value">${effect.name}</span>
                        </div>
                        <div class="component-info-row">
                            <span class="component-info-label">Тип</span>
                            <span class="component-info-value">${effect.type}</span>
                        </div>
                        <div class="component-info-row">
                            <span class="component-info-label">CSS</span>
                            <span class="component-info-value" style="font-size: 11px;">${effect.value}</span>
                        </div>
                        <div class="component-info-row">
                            <span class="component-info-label">Переменная</span>
                            <span class="component-info-value">--drop-shadow</span>
                        </div>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', async () => {
            renderColors();
            renderTypography();
            await renderComponents(); // Теперь асинхронная функция
            renderEffects();
        });
    </script>
</body>
</html>
